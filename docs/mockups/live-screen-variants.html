<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Экран интервью — 5 вариантов</title>
<style>
:root{
  --bg:#0f1216; --panel:#171b21; --panel2:#1d232b; --border:#2a323d;
  --text:#e6e9ee; --dim:#9aa4b2; --accent:#58a6ff;
  --covered:#3fb950; --partial:#d29922; --notcov:#7d8590; --high:#f85149;
  --gfs:21px;              /* базовый размер шрифта гайда */
  --radius:10px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;
  font-size:14px; overflow:hidden;
}
button{font-family:inherit; cursor:pointer}
input,textarea{font-family:inherit}

/* ---------- шапка со свитчером вариантов ---------- */
#top{
  height:44px; flex:0 0 44px; display:flex; align-items:center; gap:10px;
  padding:0 12px; background:#12161c; border-bottom:1px solid var(--border);
}
#top .rec{display:flex;align-items:center;gap:7px;font-weight:600;letter-spacing:.2px}
#top .dot{width:9px;height:9px;border-radius:50%;background:var(--high);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
#clock{font-variant-numeric:tabular-nums;color:var(--dim)}
#tabs{display:flex;gap:4px;margin-left:auto}
.tab{
  background:transparent;border:1px solid var(--border);color:var(--dim);
  padding:5px 11px;border-radius:7px;font-size:12.5px;
}
.tab.on{background:var(--accent);border-color:var(--accent);color:#0b1017;font-weight:600}
.fs{display:flex;align-items:center;gap:4px;margin-left:8px;padding-left:10px;border-left:1px solid var(--border)}
.fs button{width:26px;height:26px;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:6px;font-size:13px}

#stage{position:absolute;top:44px;left:0;right:0;bottom:0;display:flex}
.variant{display:none;flex:1;min-width:0}
.variant.on{display:flex}

/* ---------- общие элементы ---------- */
.scroll{overflow-y:auto;scrollbar-width:thin;scrollbar-color:#39424f transparent}
.scroll::-webkit-scrollbar{width:9px}
.scroll::-webkit-scrollbar-thumb{background:#39424f;border-radius:9px}

.sec-title{
  font-size:12px;text-transform:uppercase;letter-spacing:.9px;color:var(--accent);
  font-weight:700;margin:26px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border);
}
.sec-title:first-child{margin-top:0}

.blk{
  font-size:var(--gfs); line-height:1.5; padding:11px 14px; margin:2px 0 6px;
  border-radius:var(--radius); border-left:3px solid transparent; cursor:pointer;
  white-space:pre-line; transition:background .12s;
}
.blk:hover{background:#1a1f27}
.blk.cur{background:#16233a;border-left-color:var(--accent)}
.blk.done{opacity:.42}
.blk.done .txt{text-decoration:line-through;text-decoration-color:#4b5563}
.probe{display:block;margin-top:7px;font-size:.72em;color:var(--dim);font-style:italic;line-height:1.45}
.blk .badge{
  display:inline-block;vertical-align:middle;margin-left:8px;font-size:11px;font-style:normal;
  background:var(--panel2);color:var(--dim);border:1px solid var(--border);border-radius:20px;padding:1px 7px;
}

.pane{background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.pane-head{
  flex:0 0 auto;padding:10px 12px;font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;
  color:var(--dim);font-weight:700;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;
}
.pane-head .n{background:var(--panel2);border-radius:20px;padding:1px 8px;color:var(--text);font-size:11px}
.pane-body{flex:1;min-height:0;padding:10px 12px}

.inp{
  width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);
  border-radius:8px;padding:10px 12px;font-size:15px;resize:none;line-height:1.4;outline:none;
}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(88,166,255,.15)}
.inp::placeholder{color:#66707d}
.hint{font-size:11px;color:#66707d;margin-top:5px}

.note{
  background:var(--panel2);border:1px solid var(--border);border-left:3px solid var(--partial);
  border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:14px;line-height:1.45;
}
.note .meta{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;margin-bottom:3px;display:flex;gap:8px}
.note .meta b{color:var(--partial);font-weight:600}

.q{display:flex;gap:9px;align-items:flex-start;background:var(--panel2);border:1px solid var(--border);
  border-radius:8px;padding:9px 10px;margin-bottom:7px;font-size:14.5px;line-height:1.4}
.q input[type=checkbox]{margin-top:2px;width:17px;height:17px;accent-color:var(--covered);flex:0 0 auto;cursor:pointer}
.q.done{opacity:.45}
.q.done span{text-decoration:line-through}
.q .t{margin-left:auto;font-size:11px;color:#66707d;font-variant-numeric:tabular-nums}

.empty{color:#5b646f;font-size:13px;font-style:italic;padding:6px 2px}

/* ================= В1: гайд + правая колонка ================= */
#v1 .left{flex:1;min-width:0;padding:20px 26px}
#v1 .pane{flex:0 0 340px}
#v1 .pane.split{display:flex;flex-direction:column}
#v1 .half{flex:1;min-height:0;display:flex;flex-direction:column;border-bottom:1px solid var(--border)}
#v1 .half:last-child{border-bottom:0}

/* ================= В2: фокус на одном блоке ================= */
#v2{flex-direction:column}
#v2 .focus{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 8% ;min-height:0}
#v2 .kicker{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:14px}
#v2 .big{font-size:calc(var(--gfs) * 1.7);line-height:1.35;white-space:pre-line;font-weight:500}
#v2 .big .probe{font-size:.5em;margin-top:16px}
#v2 .next{margin-top:26px;font-size:15px;color:#5b646f;white-space:pre-line;border-top:1px dashed var(--border);padding-top:14px}
#v2 .next b{color:var(--dim);font-weight:600;font-size:11px;letter-spacing:.8px;text-transform:uppercase;display:block;margin-bottom:6px}
#v2 .nav{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:10px 8%;border-top:1px solid var(--border);background:#12161c}
#v2 .nav button{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 14px;font-size:13px}
#v2 .nav .prog{margin-left:auto;color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
#v2 .dock{flex:0 0 auto;display:flex;gap:12px;padding:12px 8% 16px;background:#12161c;border-top:1px solid var(--border)}
#v2 .dock > div{flex:1}
#v2 .dock .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);font-weight:700;margin-bottom:6px;display:flex;gap:7px;align-items:center}
#v2 .strip{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap;max-height:64px;overflow:auto}
.chip{background:var(--panel2);border:1px solid var(--border);border-radius:20px;padding:4px 11px;font-size:12.5px;
  display:flex;gap:6px;align-items:center;cursor:pointer;white-space:nowrap;max-width:100%}
.chip span{overflow:hidden;text-overflow:ellipsis}
.chip.done{opacity:.4;text-decoration:line-through}
.chip.c{border-left:3px solid var(--partial)}

/* ================= В3: нижний док ================= */
#v3{flex-direction:column}
#v3 .guide{flex:1;min-height:0;padding:20px 12% 30px}
#v3 .dock{flex:0 0 auto;background:#12161c;border-top:1px solid var(--border);padding:10px 12% 12px}
#v3 .qbar{display:flex;gap:7px;align-items:center;margin-bottom:9px;overflow-x:auto;padding-bottom:2px}
#v3 .qbar .lbl{font-size:11px;color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:.8px;flex:0 0 auto}
#v3 .row{display:flex;gap:9px;align-items:flex-start}
#v3 .row .inp{flex:1}
#v3 .row .side{flex:0 0 300px}
#v3 .last{max-height:96px;overflow:auto;margin-top:9px}

/* ================= В4: заметки на полях ================= */
#v4 .qcol{flex:0 0 250px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column}
#v4 .mid{flex:1;min-width:0;padding:20px 20px 20px 26px}
#v4 .row{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
#v4 .margin{padding-top:12px}
#v4 .margin .note{margin-bottom:6px;font-size:13px;border-left-color:var(--partial)}
#v4 .addhere{
  width:100%;background:transparent;border:1px dashed var(--border);color:var(--dim);border-radius:8px;
  padding:8px 10px;font-size:13px;text-align:left;
}
#v4 .row.cur .addhere{border-color:var(--accent);color:var(--accent)}
#v4 .inline-inp{width:100%;background:var(--panel2);border:1px solid var(--accent);color:var(--text);border-radius:8px;padding:8px 10px;font-size:14px;outline:none}

/* ================= В5: cockpit, 3 полосы ================= */
#v5 .nav{flex:0 0 210px;background:var(--panel);border-right:1px solid var(--border);padding:14px 10px;display:flex;flex-direction:column;gap:3px}
#v5 .nav .ttl{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);font-weight:700;margin:4px 6px 10px}
#v5 .nav a{display:flex;gap:8px;align-items:center;padding:9px 10px;border-radius:8px;color:var(--dim);font-size:13.5px;line-height:1.3;text-decoration:none}
#v5 .nav a.on{background:var(--panel2);color:var(--text);font-weight:600}
#v5 .nav a .pct{margin-left:auto;font-size:11px;color:var(--notcov);font-variant-numeric:tabular-nums}
#v5 .nav .bar{height:3px;background:var(--panel2);border-radius:3px;margin:10px 6px 0;overflow:hidden}
#v5 .nav .bar i{display:block;height:100%;background:var(--covered)}
#v5 .mid{flex:1;min-width:0;padding:20px 24px}
#v5 .pane{flex:0 0 330px}
#v5 .filters{display:flex;gap:5px;margin-left:auto}
#v5 .filters button{background:transparent;border:1px solid var(--border);color:var(--dim);border-radius:20px;padding:2px 9px;font-size:11px}
#v5 .filters button.on{background:var(--panel2);color:var(--text)}
#v5 .compose{flex:0 0 auto;border-top:1px solid var(--border);padding:10px 12px;background:#12161c}
#v5 .modes{display:flex;gap:5px;margin-bottom:7px}
#v5 .modes button{flex:1;background:var(--panel2);border:1px solid var(--border);color:var(--dim);border-radius:7px;padding:6px;font-size:12px}
#v5 .modes button.on{border-color:var(--accent);color:var(--text);background:#16233a}
</style>
</head>
<body>

<div id="top">
  <span class="rec"><i class="dot"></i>Запись</span>
  <span id="clock">00:00</span>
  <span style="color:#3c4552">|</span>
  <span style="color:var(--dim)">Интервью с автором Telegram-канала</span>
  <div id="tabs"></div>
  <div class="fs"><button id="fsm">A−</button><button id="fsp">A+</button></div>
</div>

<div id="stage">
  <section class="variant" id="v1"></section>
  <section class="variant" id="v2"></section>
  <section class="variant" id="v3"></section>
  <section class="variant" id="v4"></section>
  <section class="variant" id="v5"></section>
</div>

<script>
/* ============================================================
   ГАЙД — оригинальный текст, вставленный при создании проекта
   ============================================================ */
const GUIDE = [
 {t:"Знакомство", b:[
  {x:"Добрый день! Меня зовут Павел, я работаю исследователем в Tribute.\nСегодня мы созвонились, чтобы узнать больше о том, как авторы ведут каналы в Telegram и общаются со своими подписчиками. Спасибо, что согласились уделить время!"},
  {x:"Скажите, пожалуйста, могу ли я записать наш звонок, чтобы потом вернуться к ней?\nЗапись будет использована только мной, и не будет нигде публиковаться. Спасибо!"},
  {x:"Есть ли у вас вопросы, прежде чем мы начнём?"}
 ]},
 {t:"Канал и роль Telegram", b:[
  {x:"Расскажите, пожалуйста, о своём канале. О чём он?\nКак давно вы его завели? Почему выбрали именно телеграм?"},
  {x:"На каких ещё платформах делаете публикации? Какую роль играет Telegram?"},
  {x:"Как для вас выглядит хороший месяц на канале? По каким признакам понимаете, что всё идёт нормально?"},
  {x:"Вы ведёте канал один или кто-то помогает? Что делает?\nКто отвечает подписчикам, когда они пишут?\nКто настраивал Tribute — вы сами?"},
  {x:"Как узнали о Tribute? Когда решили завести его? Для чего его используете?\nЕсли бы вам нужно было объяснить другому автору, что умеет Tribute, что бы вы перечислили? Включая то, чем сами не пользуетесь."}
 ]},
 {t:"Работа с аудиторией: подписки, отписки, незавершённые оплаты", b:[
  {x:"Теперь давайте поговорим о том, как вы работаете с аудиторией.\nКак ваша аудитория узнаёт о Телеграм канале?"},
  {x:"Расскажите, пожалуйста, о пути, который проходит новый подписчик. Вот он или она узнаёт о вас, решает подписаться на закрытый канал, оплачивает через Трибьют - что происходит дальше?",
   p:"(пробы: как вы узнали, что он подписался; вы ему что-то отправляли; кто отправлял)"},
  {x:"Есть ли что-то, что новый подписчик должен понять или сделать в первые дни? Откуда он это узнаёт?",
   p:"(пробы: закреп, приветственный пост, отдельный бот, личка, welcome-чат)"},
  {x:"Бывало, что человек подписался и почти сразу отписался? Что, по-вашему, произошло?"},
  {x:"Когда вы в последний раз замечали, что кто-то отписался? Как узнали?\nСколько человек отписалось в прошлом месяце? Это много, мало или нормально? Почему так считаете?\nПри каком числе отписок за месяц вы бы напряглись?"},
  {x:"Пытались когда-нибудь вернуть отписавшегося? Расскажите про конкретный случай.",
   p:"(если никогда: «а почему?» — и здесь очень важно различить «не знал как», «не считаю нужным», «неловко навязываться», «нет контактов»)"},
  {x:"Знаете, что происходит, когда человек нажимает «оплатить» и не доводит платёж до конца?\nКак думаете, сколько таких людей у вас за месяц?"},
  {x:"Приходилось что-то с этим делать?"}
 ]},
 {t:"Другие инструменты", b:[
  {x:"Какие ещё боты или сервисы подключены к вашему каналу или чату? Для чего каждый?"},
  {x:"Что в работе с подписчиками отнимает больше всего времени?"}
 ]},
 {t:"Завершение", b:[
  {x:"Мы обсудили всё, что было важно услышать; большое спасибо вам за уделённое время!"}
 ]}
];

/* плоский список блоков c id */
const FLAT=[]; GUIDE.forEach((s,si)=>s.b.forEach((b,bi)=>{b.id="b"+si+"_"+bi; b.sec=s.t; b.si=si; FLAT.push(b)}));

/* ============================================================
   Состояние (общее для всех пяти вариантов)
   ============================================================ */
const S={
  v:1, cur:FLAT[0].id, done:new Set(),
  comments:[   // демо-данные, чтобы экран не был пустым
    {id:1,t:"04:12",wall:"14:32",text:"Канал про финансы для самозанятых, ведёт с 2021, пришла из Инстаграма",anchor:"b1_0"},
    {id:2,t:"07:40",wall:"14:36",text:"Хороший месяц = +80 платных, отписки не считает вообще",anchor:"b1_2"}
  ],
  questions:[
    {id:1,text:"Спросить про второй канал — бесплатный, о нём упомянула вскользь",done:false,t:"05:02"},
    {id:2,text:"Уточнить, кто именно отвечает в личке ночью",done:true,t:"06:19"}
  ],
  filter:"all", mode:"c", focus:null
};
let seq=10;
const fmt=n=>String(n).padStart(2,"0");
let t0=Date.now()-9*60000-13000;
function elapsed(){const s=Math.floor((Date.now()-t0)/1000);return fmt(Math.floor(s/60))+":"+fmt(s%60)}
function wall(){const d=new Date();return fmt(d.getHours())+":"+fmt(d.getMinutes())}
setInterval(()=>{document.getElementById("clock").textContent=elapsed()},1000);
document.getElementById("clock").textContent=elapsed();

function addComment(text){
  if(!text.trim())return;
  S.comments.unshift({id:++seq,t:elapsed(),wall:wall(),text:text.trim(),anchor:S.cur});
  render();
}
function addQuestion(text){
  if(!text.trim())return;
  S.questions.push({id:++seq,text:text.trim(),done:false,t:elapsed()});
  render();
}
function toggleQ(id){const q=S.questions.find(q=>q.id===id); if(q)q.done=!q.done; render()}
function setCur(id){S.cur=id; render()}
function toggleDone(id){S.done.has(id)?S.done.delete(id):S.done.add(id); render()}
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");

/* ============================================================
   Рендер-хелперы
   ============================================================ */
function blockHTML(b,opt={}){
  const cls=["blk"]; if(b.id===S.cur)cls.push("cur"); if(S.done.has(b.id))cls.push("done");
  const n=S.comments.filter(c=>c.anchor===b.id).length;
  return `<div class="${cls.join(" ")}" data-blk="${b.id}">`
    +`<span class="txt">${esc(b.x)}</span>`
    +(n?`<span class="badge">💬 ${n}</span>`:"")
    +(b.p?`<span class="probe">${esc(b.p)}</span>`:"")
    +`</div>`;
}
function guideHTML(opt={}){
  return GUIDE.map(s=>`<div class="sec-title">${esc(s.t)}</div>`+s.b.map(b=>blockHTML(b,opt)).join("")).join("");
}
function commentsHTML(){
  if(!S.comments.length)return `<div class="empty">Комментариев пока нет</div>`;
  return S.comments.map(c=>{
    const b=FLAT.find(x=>x.id===c.anchor);
    return `<div class="note"><div class="meta"><b>${c.t}</b><span>${c.wall}</span>`
      +(b?`<span style="margin-left:auto;color:#5b646f;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(b.x.split("\n")[0])}</span>`:"")
      +`</div>${esc(c.text)}</div>`;
  }).join("");
}
function questionsHTML(){
  if(!S.questions.length)return `<div class="empty">Дополнительных вопросов нет</div>`;
  const sorted=[...S.questions].sort((a,b)=>a.done-b.done);
  return sorted.map(q=>`<label class="q ${q.done?"done":""}">`
    +`<input type="checkbox" data-q="${q.id}" ${q.done?"checked":""}>`
    +`<span>${esc(q.text)}</span><span class="t">${q.t}</span></label>`).join("");
}
const openQ=()=>S.questions.filter(q=>!q.done).length;

/* ============================================================
   В1 — Гайд + правая колонка (комментарии / вопросы)
   ============================================================ */
function V1(){
 return `
 <div class="left scroll" data-keep="v1g">${guideHTML()}</div>
 <aside class="pane split">
   <div class="half">
     <div class="pane-head">Комментарии <span class="n">${S.comments.length}</span></div>
     <div class="pane-body scroll" data-keep="v1c">${commentsHTML()}</div>
     <div style="padding:10px 12px;border-top:1px solid var(--border)">
       <textarea class="inp" rows="2" data-add="c" placeholder="Комментарий… ⏎ — сохранить с меткой ${elapsed()}"></textarea>
       <div class="hint">Время фиксируется автоматически</div>
     </div>
   </div>
   <div class="half">
     <div class="pane-head">Спросить дополнительно <span class="n">${openQ()}</span></div>
     <div class="pane-body scroll" data-keep="v1q">${questionsHTML()}</div>
     <div style="padding:10px 12px;border-top:1px solid var(--border)">
       <textarea class="inp" rows="2" data-add="q" placeholder="Вопрос, который надо задать… ⏎"></textarea>
     </div>
   </div>
 </aside>`;
}

/* ============================================================
   В2 — Фокус: один блок крупно + нижний док
   ============================================================ */
function V2(){
 const i=FLAT.findIndex(b=>b.id===S.cur), b=FLAT[i], nx=FLAT[i+1];
 return `
 <div class="focus">
   <div class="kicker">${esc(b.sec)}</div>
   <div class="big">${esc(b.x)}${b.p?`<span class="probe">${esc(b.p)}</span>`:""}</div>
   ${nx?`<div class="next"><b>Дальше</b>${esc(nx.x.split("\n")[0])}</div>`:""}
 </div>
 <div class="nav">
   <button data-step="-1">↑ Назад</button>
   <button data-step="1">↓ Дальше</button>
   <button data-toggle="${b.id}">${S.done.has(b.id)?"↺ Снять отметку":"✓ Задан"}</button>
   <span class="prog">${i+1} / ${FLAT.length} · задано ${S.done.size}</span>
 </div>
 <div class="dock">
   <div>
     <div class="lbl">Комментарий <span style="color:var(--partial);font-variant-numeric:tabular-nums">${elapsed()}</span></div>
     <textarea class="inp" rows="2" data-add="c" placeholder="Что сказал респондент… ⏎"></textarea>
     <div class="strip">${S.comments.slice(0,4).map(c=>`<span class="chip c"><b style="color:var(--partial);font-weight:600">${c.t}</b><span>${esc(c.text)}</span></span>`).join("")}</div>
   </div>
   <div>
     <div class="lbl">Спросить дополнительно <span style="color:var(--dim)">${openQ()} открыто</span></div>
     <textarea class="inp" rows="2" data-add="q" placeholder="Добавить вопрос… ⏎"></textarea>
     <div class="strip">${S.questions.map(q=>`<span class="chip ${q.done?"done":""}" data-qchip="${q.id}">${q.done?"☑":"☐"}<span>${esc(q.text)}</span></span>`).join("")}</div>
   </div>
 </div>`;
}

/* ============================================================
   В3 — Гайд во всю ширину + нижний док
   ============================================================ */
function V3(){
 return `
 <div class="guide scroll" data-keep="v3g">${guideHTML()}</div>
 <div class="dock">
   <div class="qbar">
     <span class="lbl">Спросить:</span>
     ${S.questions.length?S.questions.map(q=>`<span class="chip ${q.done?"done":""}" data-qchip="${q.id}">${q.done?"☑":"☐"}<span>${esc(q.text)}</span></span>`).join(""):`<span class="empty" style="padding:0">пусто</span>`}
     <input class="inp" style="flex:0 0 220px;padding:4px 10px;font-size:13px;border-radius:20px" data-add="q" placeholder="+ вопрос ⏎">
   </div>
   <div class="row">
     <textarea class="inp" rows="2" data-add="c" placeholder="Комментарий к текущему вопросу… ⏎ сохранить  ·  метка ${elapsed()}"></textarea>
     <div class="side scroll last">${S.comments.slice(0,3).map(c=>`<div class="note" style="font-size:13px;padding:6px 9px"><div class="meta"><b>${c.t}</b></div>${esc(c.text)}</div>`).join("")||`<div class="empty">Комментариев нет</div>`}</div>
   </div>
 </div>`;
}

/* ============================================================
   В4 — Заметки на полях: комментарий крепится к строке гайда
   ============================================================ */
function V4(){
 const rows=GUIDE.map(s=>
   `<div class="sec-title">${esc(s.t)}</div>`+
   s.b.map(b=>{
     const my=S.comments.filter(c=>c.anchor===b.id);
     const cur=b.id===S.cur;
     return `<div class="row ${cur?"cur":""}">
       <div>${blockHTML(b)}</div>
       <div class="margin">
         ${my.map(c=>`<div class="note"><div class="meta"><b>${c.t}</b><span>${c.wall}</span></div>${esc(c.text)}</div>`).join("")}
         ${cur&&S.focus==="inline"
           ? `<input class="inline-inp" data-add="c" placeholder="Комментарий сюда… ⏎">`
           : `<button class="addhere" data-focus="${b.id}">+ комментарий к этому вопросу</button>`}
       </div>
     </div>`;
   }).join("")).join("");
 return `
 <aside class="qcol">
   <div class="pane-head">Спросить ещё <span class="n">${openQ()}</span></div>
   <div class="pane-body scroll" data-keep="v4q">${questionsHTML()}</div>
   <div style="padding:10px 12px;border-top:1px solid var(--border)">
     <textarea class="inp" rows="3" data-add="q" placeholder="Вопрос… ⏎"></textarea>
   </div>
 </aside>
 <div class="mid scroll" data-keep="v4g">${rows}</div>`;
}

/* ============================================================
   В5 — Cockpit: разделы / гайд / единая лента
   ============================================================ */
function V5(){
 const curSec=FLAT.find(b=>b.id===S.cur).si;
 const navs=GUIDE.map((s,i)=>{
   const total=s.b.length, done=s.b.filter(b=>S.done.has(b.id)).length;
   return `<a class="${i===curSec?"on":""}" data-sec="${i}">${esc(s.t)}<span class="pct">${done}/${total}</span></a>`;
 }).join("");
 const feed=[
   ...S.comments.map(c=>({k:"c",t:c.t,o:c})),
   ...S.questions.map(q=>({k:"q",t:q.t,o:q}))
 ].filter(x=>S.filter==="all"||S.filter===x.k).sort((a,b)=>b.t.localeCompare(a.t));
 const feedHTML=feed.length?feed.map(x=>x.k==="c"
   ? `<div class="note"><div class="meta"><b>${x.o.t}</b><span>комментарий</span></div>${esc(x.o.text)}</div>`
   : `<label class="q ${x.o.done?"done":""}" style="border-left:3px solid var(--accent)"><input type="checkbox" data-q="${x.o.id}" ${x.o.done?"checked":""}><span>${esc(x.o.text)}</span><span class="t">${x.o.t}</span></label>`
 ).join(""):`<div class="empty">Пока пусто</div>`;
 const doneAll=Math.round(S.done.size/FLAT.length*100);
 return `
 <nav class="nav">
   <div class="ttl">Разделы гайда</div>${navs}
   <div class="bar"><i style="width:${doneAll}%"></i></div>
   <div style="margin:6px;font-size:11px;color:var(--dim)">пройдено ${doneAll}% · ${elapsed()}</div>
 </nav>
 <div class="mid scroll" data-keep="v5g">${guideHTML()}</div>
 <aside class="pane">
   <div class="pane-head">Лента
     <div class="filters">
       <button data-f="all" class="${S.filter==="all"?"on":""}">всё</button>
       <button data-f="c" class="${S.filter==="c"?"on":""}">💬 ${S.comments.length}</button>
       <button data-f="q" class="${S.filter==="q"?"on":""}">☐ ${openQ()}</button>
     </div>
   </div>
   <div class="pane-body scroll" data-keep="v5f">${feedHTML}</div>
   <div class="compose">
     <div class="modes">
       <button data-m="c" class="${S.mode==="c"?"on":""}">Комментарий</button>
       <button data-m="q" class="${S.mode==="q"?"on":""}">Вопрос на потом</button>
     </div>
     <textarea class="inp" rows="2" data-add="${S.mode}" placeholder="${S.mode==="c"?"Комментарий · метка "+elapsed():"Что не забыть спросить"}… ⏎"></textarea>
   </div>
 </aside>`;
}

/* ============================================================
   Рендер + события
   ============================================================ */
const R={1:V1,2:V2,3:V3,4:V4,5:V5};
const NAMES={1:"В1 · Правая колонка",2:"В2 · Фокус",3:"В3 · Нижний док",4:"В4 · На полях",5:"В5 · Cockpit"};
document.getElementById("tabs").innerHTML=Object.keys(R).map(k=>`<button class="tab" data-v="${k}">${NAMES[k]}</button>`).join("");

let scrolls={};
function render(){
  document.querySelectorAll("[data-keep]").forEach(e=>scrolls[e.dataset.keep]=e.scrollTop);
  const el=document.getElementById("v"+S.v);
  el.innerHTML=R[S.v]();
  document.querySelectorAll(".variant").forEach(v=>v.classList.toggle("on",v.id==="v"+S.v));
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",+t.dataset.v===S.v));
  el.querySelectorAll("[data-keep]").forEach(e=>{if(scrolls[e.dataset.keep])e.scrollTop=scrolls[e.dataset.keep]});
  if(S.refocus){const t=el.querySelector(`[data-add="${S.refocus}"]`); if(t)t.focus(); S.refocus=null}
}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-v],[data-blk],[data-q],[data-qchip],[data-step],[data-toggle],[data-sec],[data-f],[data-m],[data-focus]");
  if(!t)return;
  if(t.dataset.v){S.v=+t.dataset.v; S.focus=null; render()}
  else if(t.dataset.blk){setCur(t.dataset.blk)}
  else if(t.dataset.q){toggleQ(+t.dataset.q)}
  else if(t.dataset.qchip){toggleQ(+t.dataset.qchip)}
  else if(t.dataset.step){step(+t.dataset.step)}
  else if(t.dataset.toggle){toggleDone(t.dataset.toggle)}
  else if(t.dataset.sec){S.cur=GUIDE[+t.dataset.sec].b[0].id; render()}
  else if(t.dataset.f){S.filter=t.dataset.f; render()}
  else if(t.dataset.m){S.mode=t.dataset.m; S.refocus=t.dataset.m; render()}
  else if(t.dataset.focus){S.cur=t.dataset.focus; S.focus="inline"; S.refocus="c"; render()}
},true);

document.addEventListener("keydown",e=>{
  const a=e.target.closest("[data-add]");
  if(a&&e.key==="Enter"&&!e.shiftKey){
    e.preventDefault();
    const kind=a.dataset.add, val=a.value;
    a.value="";
    S.refocus=kind==="c"&&S.focus==="inline"?null:kind;
    if(S.focus==="inline")S.focus=null;
    kind==="c"?addComment(val):addQuestion(val);
    return;
  }
  if(a)return;                                   // в поле ввода горячие клавиши не работают
  if(e.key==="ArrowDown"||e.key==="ArrowRight"){e.preventDefault();step(1)}
  if(e.key==="ArrowUp"||e.key==="ArrowLeft"){e.preventDefault();step(-1)}
  if(e.key===" "){e.preventDefault();toggleDone(S.cur)}
  if(e.key>="1"&&e.key<="5"){S.v=+e.key; render()}
});
function step(d){
  const i=FLAT.findIndex(b=>b.id===S.cur), n=Math.max(0,Math.min(FLAT.length-1,i+d));
  S.cur=FLAT[n].id; render();
  const el=document.querySelector(`[data-blk="${S.cur}"]`);
  if(el)el.scrollIntoView({block:"center",behavior:"smooth"});
}

let fs=21;
document.getElementById("fsp").onclick=()=>{fs=Math.min(40,fs+2);document.documentElement.style.setProperty("--gfs",fs+"px")};
document.getElementById("fsm").onclick=()=>{fs=Math.max(14,fs-2);document.documentElement.style.setProperty("--gfs",fs+"px")};

render();
setInterval(()=>{ // обновляем метку времени в плейсхолдерах, не мешая вводу
  document.querySelectorAll("[data-add='c']").forEach(i=>{
    if(document.activeElement!==i && i.placeholder.includes("метка"))
      i.placeholder=i.placeholder.replace(/\d\d:\d\d/,elapsed());
  });
},5000);
</script>
</body>
</html>
